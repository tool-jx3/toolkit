<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼貼信產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="../../assets/i18n.js"></script>
    <script defer src="./i18n.collage-letter.js"></script>
    <script defer src="./app.js"></script>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto w-full flex justify-end mb-2">
        <select id="localeSelect" class="locale-select" data-i18n-aria-label="lang.aria" aria-label="顯示語言"></select>
    </div>

    <main class="max-w-5xl mx-auto w-full space-y-6 flex-grow">
        <header class="text-center space-y-2">
            <h1 class="text-4xl md:text-5xl text-red-600 tracking-tighter" style="font-family: 'Black Han Sans', sans-serif; text-shadow: 2px 2px 0px #5c5c5c;" data-i18n-node="app.title">
                拼貼信產生器
                <a href="https://x.com/bb_uu_t" target="_blank" style="font-size: 14px; color: #ffffff; margin-left: 10px;"> @bb_uu_t</a>
            </h1>
        </header>

        <section class="bg-gray-800 p-4 md:p-6 rounded-xl shadow-xl space-y-4">
            <label for="message-input" class="block text-lg font-bold text-gray-200" data-i18n="message.label">信件內容</label>
            <textarea id="message-input" rows="3" class="w-full bg-gray-700 text-white rounded-lg p-3 border border-gray-600 focus:border-red-500 focus:ring-2 focus:ring-red-500 outline-none resize-none text-lg transition" data-i18n-placeholder="message.placeholder" placeholder="例如：今晚午夜，我將前來竊取你的心。"></textarea>

            <div class="flex flex-wrap gap-3">
                <button id="btn-generate" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition transform hover:scale-105 shadow-lg flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.62,0L36.68,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l12.69-12.69,44.69,44.69Z"></path></svg>
                    <span data-i18n="btn.generate">產生信件</span>
                </button>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-800 p-4 md:p-6 rounded-xl shadow-xl space-y-4 md:col-span-2">
                <h3 class="text-lg font-bold text-gray-200 border-b border-gray-700 pb-2" data-i18n="layout.heading">📏 尺寸與版面設定</h3>
                <div class="flex flex-wrap gap-4 items-center">
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-gray-300" data-i18n="layout.charSize.label">文字大小：</span>
                        <input type="number" id="global-min-size" value="45" class="w-16 bg-gray-700 text-white rounded p-1 text-sm border border-gray-600 outline-none text-center">
                        <span class="text-gray-500">~</span>
                        <input type="number" id="global-max-size" value="70" class="w-16 bg-gray-700 text-white rounded p-1 text-sm border border-gray-600 outline-none text-center">
                        <span class="text-sm text-gray-400">px</span>
                    </div>
                    <div class="flex items-center gap-2 border-l border-gray-600 pl-4">
                        <span class="text-sm text-gray-300" data-i18n="layout.imageWidth.label">圖片寬度：</span>
                        <input type="number" id="canvas-width-input" value="800" class="w-20 bg-gray-700 text-white rounded p-1 text-sm border border-gray-600 outline-none text-center">
                        <span class="text-sm text-gray-400">px</span>
                    </div>
                    <div class="flex items-center gap-2 border-l border-gray-600 pl-4">
                        <input type="checkbox" id="auto-width-checkbox" class="accent-red-500 w-4 h-4 cursor-pointer">
                        <label for="auto-width-checkbox" class="text-sm text-gray-300 cursor-pointer select-none" data-i18n="layout.autoWidth.label">依最長行自動調整寬度（停用自動換行）</label>
                    </div>
                    <div class="flex items-center gap-2 border-l border-gray-600 pl-4">
                        <span class="text-sm text-gray-300" data-i18n="layout.align.label">對齊方式：</span>
                        <select id="text-alignment" class="bg-gray-700 text-white rounded p-1 text-sm border border-gray-600 outline-none">
                            <option value="left" data-i18n="align.left">靠左</option>
                            <option value="center" selected data-i18n="align.center">置中</option>
                            <option value="right" data-i18n="align.right">靠右</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 p-4 md:p-6 rounded-xl shadow-xl space-y-4">
                <h3 class="text-lg font-bold text-gray-200 border-b border-gray-700 pb-2" data-i18n="color.heading">🎨 色彩配色設定</h3>
                <div id="color-options" class="flex flex-wrap gap-3"></div>
                <div class="flex gap-2 flex-col sm:flex-row mt-2 pt-4 border-t border-gray-700 items-center">
                    <span class="text-sm text-gray-300 w-full sm:w-auto" data-i18n="color.addLabel">新增自訂色彩：</span>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <label class="text-xs text-gray-400" data-i18n="color.bgLabel">背景</label>
                        <input type="color" id="custom-bg-color" value="#ffffff" class="w-8 h-8 rounded cursor-pointer bg-gray-700 border-0 p-0">
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <label class="text-xs text-gray-400" data-i18n="color.textLabel">文字</label>
                        <input type="color" id="custom-text-color" value="#000000" class="w-8 h-8 rounded cursor-pointer bg-gray-700 border-0 p-0">
                    </div>
                    <button id="btn-add-color" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-4 rounded transition text-sm whitespace-nowrap w-full sm:w-auto mt-2 sm:mt-0" data-i18n="action.add">新增</button>
                </div>
            </div>
            <div class="bg-gray-800 p-4 md:p-6 rounded-xl shadow-xl space-y-4">
                <h3 class="text-lg font-bold text-gray-200 border-b border-gray-700 pb-2" data-i18n="font.heading">🔤 字型設定與新增</h3>
                <div id="font-options" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar p-1"></div>
                <div class="flex gap-2 flex-col sm:flex-row mt-2">
                    <input type="text" id="custom-font-name" data-i18n-placeholder="font.nameInput.placeholder" placeholder="字型名稱（例如：MyFont）" class="w-full sm:w-1/3 bg-gray-700 text-white rounded p-2 text-sm border border-gray-600 focus:border-red-500 outline-none">
                    <input type="text" id="custom-font-url" data-i18n-placeholder="font.urlInput.placeholder" placeholder="網頁字型 URL（css、woff）" class="flex-1 bg-gray-700 text-white rounded p-2 text-sm border border-gray-600 focus:border-red-500 outline-none">
                    <button id="btn-add-font" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded transition text-sm whitespace-nowrap" data-i18n="action.add">新增</button>
                </div>
            </div>
        </section>

        <section class="space-y-4 relative">
            <div class="flex justify-between items-end flex-wrap gap-2">
                <h2 class="text-xl font-bold text-gray-200" data-i18n="preview.heading">預覽</h2>
                <div class="flex flex-wrap gap-2">
                    <button id="btn-png" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-md text-sm font-semibold transition" data-i18n-title="action.downloadPng.title" title="儲存為透明背景 PNG" data-i18n="action.downloadPng">PNG 下載</button>
                    <button id="btn-jpg" class="bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-md text-sm font-semibold transition" data-i18n-title="action.downloadJpg.title" title="儲存為紙張質感背景 JPG" data-i18n="action.downloadJpg">JPG 下載</button>
                    <button id="btn-copy" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md text-sm font-semibold transition" data-i18n-title="action.copyImage.title" title="複製圖片到剪貼簿" data-i18n="action.copyImage">複製圖片</button>
                    <button id="btn-copy-html" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-md text-sm font-semibold transition" data-i18n-title="action.copyHtml.title" title="複製可用於 Tistory 等支援 HTML 的平台程式碼" data-i18n="action.copyHtml">複製 HTML</button>
                    <button id="btn-copy-roll20" class="bg-purple-600 hover:bg-purple-700 text-white py-2 px-4 rounded-md text-sm font-semibold transition" data-i18n-title="action.copyRoll20.title" title="複製 Roll20 聊天室專用特殊格式文字" data-i18n="action.copyRoll20">複製 Roll20</button>
                </div>
            </div>

            <div class="flex flex-col gap-3 mb-4 bg-gray-800 p-3 rounded-xl shadow-inner border border-gray-700 w-full md:w-max mt-2">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="roll20-basic-font" class="accent-purple-500 w-4 h-4 cursor-pointer" checked>
                    <label for="roll20-basic-font" class="text-sm text-gray-300 cursor-pointer select-none" data-i18n="roll20.basicFont.label">複製 Roll20 時轉換為基本字型（明體／黑體／標楷體隨機）</label>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-300" data-i18n="roll20.fontSize.label">Roll20 文字大小：</span>
                    <div class="flex items-center gap-1">
                        <label class="text-xs text-gray-400" data-i18n="roll20.min.label">最小</label>
                        <input type="number" id="roll20-min-size" value="16" min="10" max="40" class="w-14 bg-gray-700 text-white rounded p-1 text-sm border border-gray-600 outline-none text-center">
                    </div>
                    <span class="text-gray-500">~</span>
                    <div class="flex items-center gap-1">
                        <label class="text-xs text-gray-400" data-i18n="roll20.max.label">最大</label>
                        <input type="number" id="roll20-max-size" value="24" min="10" max="50" class="w-14 bg-gray-700 text-white rounded p-1 text-sm border border-gray-600 outline-none text-center">
                        <span class="text-xs text-gray-400">px</span>
                    </div>
                </div>
            </div>

            <div class="canvas-container" id="canvas-wrapper">
                <canvas id="output-canvas"></canvas>
            </div>
            <p class="text-xs text-gray-500 text-center" data-i18n="preview.hint">結果過長或超出範圍時會自動換行。</p>
        </section>
    </main>

    <div id="toast" class="bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl border border-gray-700 font-bold flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#10B981" viewBox="0 0 256 256"><path d="M176.49,95.51a12,12,0,0,1,0,17l-56,56a12,12,0,0,1-17,0l-24-24a12,12,0,1,1,17-17L112,142.05l47.51-47.52A12,12,0,0,1,176.49,95.51ZM236,128A108,108,0,1,1,128,20,108.12,108.12,0,0,1,236,128Zm-24,0a84,84,0,1,0-84,84A84.09,84.09,0,0,0,212,128Z"></path></svg>
        <span id="toast-message" data-i18n="toast.default">已複製到剪貼簿！</span>
    </div>

    <div id="font-preloader" style="position: absolute; opacity: 0; pointer-events: none; top: -9999px;">
        <span style="font-family: 'Black Han Sans'">字</span>
        <span style="font-family: 'Do Hyeon'">字</span>
        <span style="font-family: 'DotGothic16'">字</span>
        <span style="font-family: 'Jua'">字</span>
        <span style="font-family: 'Permanent Marker'">A</span>
        <span style="font-family: 'Rampart One'">A</span>
        <span style="font-family: 'KCC-Chassam'">字</span>
        <span style="font-family: 'GmarketSansMedium'">字</span>
        <span style="font-family: 'MaplestoryOTFLight'">字</span>
        <span style="font-family: 'UhBeeSe_hyun'">字</span>
    </div>

</body>
</html>
