<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字方框產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="../../assets/i18n.js"></script>
    <script defer src="./i18n.textbox.js"></script>
    <script defer src="./app.js"></script>
</head>
<body class="text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="toolkit-bar flex justify-between items-center mb-4">
            <a class="home-link" href="../../" data-i18n="nav.home">← TRPG Toolkit</a>
            <select id="localeSelect" class="locale-select" data-i18n-aria-label="lang.aria" aria-label="顯示語言"></select>
        </div>

        <header class="mb-8">
            <a href="https://x.com/bb_uu_t" class="text-blue-600 hover:underline text-sm" target="_blank" rel="noopener noreferrer">@bb_uu_t</a>
            <h1 class="text-3xl font-bold text-slate-900 mb-2" data-i18n="app.title">文字方框產生器</h1>
            <p class="text-slate-600" data-i18n="app.tagline">產生換行整齊、可以直接在線上跑團（ORPG）的聊天欄送出的文字方框。</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

                <div class="flex border-b border-slate-200 mb-6">
                    <button id="tab-box" class="flex-1 pb-3 text-center tab-active transition-colors" onclick="switchTab('box')" data-i18n="tab.box">一般方框（線索資料等）</button>
                    <button id="tab-table" class="flex-1 pb-3 text-center tab-inactive transition-colors" onclick="switchTab('table')" data-i18n="tab.table">產生表格</button>
                </div>

                <div class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="preset.label">寬度補正</label>
                        <select id="preset-selector" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50" onchange="toggleManual(); generateOutput();">
                            <option value="cocoforia" data-i18n="preset.auto">自動補正</option>
                            <option value="standard" data-i18n="preset.standard">標準等寬（1:2）</option>
                            <option value="manual" data-i18n="preset.manual">手動設定</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="line.label">框線樣式</label>
                        <select id="line-style" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" onchange="generateOutput()">
                            <option value="light" data-i18n="line.light">細線（┌ ─ ┐）</option>
                            <option value="double" data-i18n="line.double">雙線（╔ ═ ╗）</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="pad.label">留白填充字元</label>
                        <select id="pad-char" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" onchange="generateOutput()">
                            <option value="full" data-i18n="pad.full">全形空白（　），推薦</option>
                            <option value="half" data-i18n="pad.half">半形空白（ ）</option>
                        </select>
                    </div>
                </div>

                <div class="mb-6 flex items-center bg-slate-50 border border-slate-200 p-3 rounded-md">
                    <input type="checkbox" id="wrap-box" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" onchange="generateOutput()">
                    <label for="wrap-box" class="ml-2 block text-sm font-medium text-slate-700" data-i18n="wrap.label">用完整外框包起來（顯示左右框線與四個角）</label>
                </div>

                <div id="manual-settings" class="hidden mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-slate-50 rounded-md border border-slate-200">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="manual.fullWidth">中韓文／全形字寬度補正</label>
                        <input type="number" id="kor-weight" value="2.66" step="0.01" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="manual.border">框線寬度補正</label>
                        <input type="number" id="border-weight" value="2.12" step="0.01" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" oninput="generateOutput()">
                    </div>
                </div>

                <div id="mode-box" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="box.maxWidth">方框最大寬度</label>
                        <input type="number" id="max-width" value="24" min="10" max="100" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" oninput="generateOutput()">
                        <p class="text-xs text-slate-500 mt-1" data-i18n="box.maxWidth.hint">框線的數量會隨文字長度自動調整；超過這個值就換行。</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="box.title">方框標題（選填）</label>
                        <input type="text" id="box-title" data-i18n-placeholder="box.title.placeholder" placeholder="例：線索：老舊的日記本" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" oninput="generateOutput()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="box.content">方框內容</label>
                        <textarea id="box-content" rows="6" data-i18n-placeholder="box.content.placeholder" placeholder="請輸入內容，會依寬度自動換行。" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" oninput="generateOutput()"></textarea>
                    </div>
                </div>

                <div id="mode-table" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="table.maxWidth">表格整體最大寬度</label>
                        <input type="number" id="table-max-width" value="19" min="10" max="150" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" oninput="generateOutput()">
                        <p class="text-xs text-slate-500 mt-1" data-i18n="table.maxWidth.hint">超過這個值時，會從內容較長的欄開始，自動在格子裡換行。</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" data-i18n="table.data">輸入表格資料</label>
                        <!-- 範例的換行直接寫在屬性值裡（上游寫成 &#10;，解析後一樣），好和字典逐字比對。 -->
                        <textarea id="table-content" rows="8" data-i18n-placeholder="table.data.placeholder" placeholder="1 | 大失敗 | 受到 1d6 點傷害。
---
2 | 失敗 | 出現了不祥的預兆。
3 | 成功 | 獲得一條線索。" class="w-full border border-slate-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500" oninput="generateOutput()"></textarea>
                        <p class="text-xs text-slate-500 mt-1">
                            <span data-i18n="table.hint.columns">各欄請用 `|` 符號分隔。</span>
                            <strong class="text-blue-600" data-i18n="table.hint.divider">在一行裡只輸入 `---`，就會加一條橫向分隔線。</strong>
                        </p>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="table-header" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" onchange="generateOutput()">
                        <label for="table-header" class="ml-2 block text-sm text-slate-700" data-i18n="table.header">把第一列當成標題，在它下面加一條分隔線</label>
                    </div>
                </div>

            </div>

            <div class="bg-slate-900 rounded-xl shadow-sm border border-slate-800 p-6 flex flex-col h-full min-h-[400px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-medium text-slate-100" data-i18n="preview.heading">預覽</h2>
                    <button id="copy-btn" onclick="copyResult()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-colors text-sm font-medium flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span data-i18n="copy.button">複製</span>
                    </button>
                </div>

                <div class="cocoforia-input-container">
                    <textarea id="result-output" readonly class="preview-text"></textarea>
                </div>

                <div id="copy-toast" class="mt-3 text-emerald-400 text-sm opacity-0 transition-opacity text-center" data-i18n="copy.toast">已複製到剪貼簿！請貼到聊天欄。</div>
            </div>
        </div>
    </div>

    <!-- 邏輯在 app.js，已在 head 以 defer 載入（字典之後）。 -->
</body>
</html>
