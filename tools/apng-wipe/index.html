<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>輕量轉場 APNG 產生器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap"><a class="tk-home" href="../../">← TRPG Toolkit</a><h1>輕量轉場 APNG 產生器</h1><p>製作透明背景的場景轉換 APNG。<br>可以選擇時間、顏色、角度，以及是否重複播放。</p><p class="intro-note">尺寸刻意做得很小：轉場用的圖片通常會被放大到整個畫面，15×15 px 放大後邊緣自然柔和，檔案也只有幾 KB。需要特定大小時可以選「自訂尺寸」。</p><div class="panel"><section class="settings"><fieldset><legend>尺寸（寬×高）</legend><div class="choices typechoices"><label><input type="radio" name="type" value="square" checked>正方形 <span class="dimension">15×15px</span></label><label><input type="radio" name="type" value="portrait">直式 <span class="dimension">15×30px</span></label><label><input type="radio" name="type" value="landscape">橫式 <span class="dimension">30×15px</span></label><label><input type="radio" name="type" value="free">自訂尺寸 <span class="dimension">自行指定寬與高</span></label></div><div id="customsize" hidden><label>寬（px）<input id="freewidth" type="number" min="1" max="1200" step="1" value="20" inputmode="numeric"></label><label>高（px）<input id="freeheight" type="number" min="1" max="1200" step="1" value="20" inputmode="numeric"></label></div></fieldset>
<fieldset><legend>轉場方式</legend><div><label><input type="radio" name="mode" value="normal" checked>淡入淡出（只改變透明度）</label><label><input type="radio" name="mode" value="wipe">抹除（指定角度）</label></div></fieldset><label id="anglewrap" hidden>角度 <strong id="anglevalue">0°・向右</strong><input id="angle" type="range" min="0" max="7" step="1" value="0" aria-label="角度"><span class="angleticks" aria-hidden="true"><span>0°</span><span>45°</span><span>90°</span><span>135°</span><span>180°</span><span>225°</span><span>270°</span><span>315°</span></span></label><fieldset><legend>時間 <strong id="secondsvalue">1.0 秒</strong></legend><input id="seconds" type="range" min="0" max="10" step="1" value="2" aria-label="時間"><div class="timeticks" aria-hidden="true"><span>0.2</span><span>0.5</span><span>1</span><span>1.5</span><span>2</span><span>2.5</span><span>3</span><span>3.5</span><span>4</span><span>4.5</span><span>5</span></div><small class="timeunit">秒</small></fieldset>
<fieldset><legend>變化</legend><div><label><input type="radio" name="direction" value="cover" checked>透明 → 顏色</label><label><input type="radio" name="direction" value="reveal">顏色 → 透明</label></div></fieldset><fieldset><legend>重複播放</legend><div><label><input type="radio" name="loop" value="once" checked>播一次</label><label><input type="radio" name="loop" value="forever">循環</label></div></fieldset>
</section><section class="side"><div class="colorbox"><label for="colorpad">顏色</label><div class="colorpadwrap"><canvas id="colorpad" class="colorpad" width="240" height="150" aria-label="亮度與彩度調色盤"></canvas><span class="colorpadmark" id="colorpadmark"></span></div><label for="hue">色相</label><input id="hue" class="hue" type="range" min="0" max="360" value="268"><div class="swatchline"><span class="swatch" id="swatch"></span><input id="color" class="hex" type="text" value="#28212f" maxlength="7" aria-label="16 進位色碼"></div></div>
<div class="previewcard"><div class="previewheading"><h2>預覽</h2><span id="previewsize">15×15px · 放大 4 倍</span></div><fieldset><legend>預覽背景</legend><div class="choices"><label><input type="radio" name="previewbg" value="white" checked>白</label><label><input type="radio" name="previewbg" value="black">黑</label></div></fieldset><div class="preview"><div class="previewbg" id="previewbg"><canvas id="preview" width="15" height="15" aria-label="轉場預覽"></canvas></div></div><button id="restart" class="secondary" type="button">重新播放預覽</button></div><button id="download">匯出並儲存 APNG</button><output id="status" role="status"></output></section></div></main>
<script src="app.js"></script>
</body>
</html>
