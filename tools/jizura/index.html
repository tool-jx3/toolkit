<title>JIZURA 字面</title>
<!-- JIZURA 的原作者已提供官方繁體中文版，合輯不再收錄副本，改為跳轉到原站。
     依合輯共用的語言設定（trpg-toolkit-locale）選版本：日文→原站首頁、韓文→ko/、其餘→zh-hant/。
     沒有 JavaScript 時由 meta refresh 導到繁中版。 -->
<meta http-equiv="refresh" content="0; url=https://852wa.github.io/JIZURA/zh-hant/">
<script>
(function () {
  var BASE = 'https://852wa.github.io/JIZURA/';
  var EDITION = { 'ja': '', 'ko': 'ko/', 'zh-TW': 'zh-hant/' };
  var l = null;
  try { l = localStorage.getItem('trpg-toolkit-locale'); } catch (e) {}
  location.replace(BASE + (Object.prototype.hasOwnProperty.call(EDITION, l) ? EDITION[l] : EDITION['zh-TW']));
})();
</script>
<style>
body { font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; margin: 0; padding: 48px 20px; background: #0c0c0e; color: #ece7e1; line-height: 1.7; }
main { max-width: 560px; margin: auto; }
a { color: #f5a50c; }
.back { color: #8e8a94; font-size: .9rem; text-decoration: none; }
</style>
</head>

<main>

    <a href="https://852wa.github.io/JIZURA/zh-hant/">繁體中文</a>・<a href="https://852wa.github.io/JIZURA/" lang="ja">日本語</a>・<a href="https://852wa.github.io/JIZURA/ko/" lang="ko">한국어</a></p>
</main>
</body>
</html>
