<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字軌跡產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="../../assets/i18n.js"></script>
    <script defer src="./i18n.text-path.js"></script>
    <script defer src="./app.js"></script>
</head>
<body class="text-gray-800 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto flex justify-end mb-2">
        <select id="localeSelect" class="locale-select" data-i18n-aria-label="lang.aria" aria-label="顯示語言"></select>
    </div>

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Panel: Controls & Input -->
        <div class="w-full md:w-1/3 bg-gray-50 p-6 border-r border-gray-200 flex flex-col gap-6">
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-gray-700" data-i18n="input.label">文字內容</label>
                    <span class="text-xs text-gray-500" data-i18n-node="charCount.label">字數（不含空白）： <span id="charCount" class="font-bold text-blue-600">0</span><span data-i18n="unit.char">字</span></span>
                </div>
                <textarea id="inputText" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none transition-shadow" data-i18n-placeholder="input.placeholder" placeholder="請在此輸入文字。"></textarea>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="shape.label">選擇形狀</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setShape('circle')" class="shape-btn px-3 py-2 text-sm bg-white border border-gray-300 rounded-md hover:bg-gray-100 focus:bg-blue-50 focus:border-blue-500 focus:text-blue-600 transition-colors" data-i18n="shape.circle">圓形</button>
                        <button onclick="setShape('spiral')" class="shape-btn px-3 py-2 text-sm bg-white border border-gray-300 rounded-md hover:bg-gray-100 focus:bg-blue-50 focus:border-blue-500 focus:text-blue-600 transition-colors" data-i18n="shape.spiral">螺旋形</button>
                        <button onclick="setShape('heart')" class="shape-btn px-3 py-2 text-sm bg-white border border-gray-300 rounded-md hover:bg-gray-100 focus:bg-blue-50 focus:border-blue-500 focus:text-blue-600 transition-colors" data-i18n="shape.heart">愛心</button>
                        <button onclick="setShape('custom')" class="shape-btn px-3 py-2 text-sm bg-white border border-gray-300 rounded-md hover:bg-gray-100 focus:bg-blue-50 focus:border-blue-500 focus:text-blue-600 transition-colors ring-2 ring-blue-500 text-blue-600" id="btn-custom" data-i18n="shape.custom">自由繪製</button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n-node="grid.label">
                        格線大小（解析度）： <span id="gridSizeLabel" class="font-bold text-blue-600">25</span>
                    </label>
                    <input type="range" id="gridSize" min="15" max="50" value="25" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    <p class="text-xs text-gray-500 mt-1" data-i18n="grid.hint">數字越大，排列越寬廣且越精細。</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n-node="density.label">
                        自動調整間距： <span id="densityLabel" class="font-bold text-blue-600">適中 (1.2)</span>
                    </label>
                    <input type="range" id="densitySlider" min="0.5" max="3.0" step="0.1" value="1.2" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    <p class="text-xs text-gray-500 mt-1" data-i18n="density.hint">自動調整大小時，用來控制文字聚集或分散的程度。</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="space.label">空白字元</label>
                    <select id="spaceChar" class="w-full p-2 border border-gray-300 rounded-md bg-white text-sm focus:ring-blue-500 focus:border-blue-500 transition-colors">
                        <option value="　" data-i18n="space.fullwidth">全形空白</option>
                        <option value=" " data-i18n="space.normal">一般空白</option>
                        <option value="ㆍ" data-i18n="space.middleDot">間隔號</option>
                    </select>

                    <div class="mt-3 flex items-center gap-2">
                        <input type="checkbox" id="twitterOpt" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                        <label for="twitterOpt" class="text-sm text-gray-700 cursor-pointer select-none" data-i18n-node="twitter.label" data-i18n-title="twitter.title" title="使用透明的點字特殊字元，防止在 Twitter（X）上開頭空白被省略導致圖形跑版。">
                            使用 Twitter 專用空白 <span class="text-xs text-gray-500" data-i18n="twitter.labelNote">（防止跑版）</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="mt-auto pt-4 flex flex-col gap-2">
                <button onclick="generateText()" class="w-full py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-md transform active:scale-[0.98]" data-i18n="btn.generate">
                    產生文字
                </button>
            </div>
        </div>

        <!-- Right Panel: Canvas & Output -->
        <div class="w-full md:w-2/3 p-6 flex flex-col gap-6">
            
            <div class="flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-semibold text-gray-800" data-i18n-node="output.pathHeading">
                        軌跡繪製
                        <a href="https://x.com/bb_uu_t" style="font-size: 10px"> @bb_uu_t</a>
                    </h2>
                    <div class="flex gap-2">
                        <button onclick="autoScalePath()" class="text-sm text-green-600 hover:text-green-800 font-medium px-2 py-1 rounded hover:bg-green-50 transition-colors" data-i18n-title="action.autoScale.title" title="依文字數量自動調整軌跡大小" data-i18n="action.autoScale">
                            自動調整大小
                        </button>
                        <button onclick="reversePath()" class="text-sm text-blue-600 hover:text-blue-800 font-medium px-2 py-1 rounded hover:bg-blue-50 transition-colors" data-i18n="action.reverse">
                            反轉方向
                        </button>
                        <button onclick="clearCanvas()" class="text-sm text-red-500 hover:text-red-700 font-medium px-2 py-1 rounded hover:bg-red-50 transition-colors" data-i18n="action.clear">
                            清除
                        </button>
                    </div>
                </div>
                <div class="w-full bg-white border-2 border-dashed border-gray-300 rounded-xl overflow-hidden relative" style="height: 300px;">
                    <!-- Canvas element that adapts to container size -->
                    <canvas id="drawCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                    <div id="drawHint" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-50">
                        <span class="text-gray-500 font-medium bg-white px-3 py-1 rounded-full shadow-sm" data-i18n="draw.hint">請用滑鼠或觸控在此繪製線條！</span>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-semibold text-gray-800" data-i18n="result.heading">結果</h2>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-500" data-i18n-node="result.count.label">結果總字數： <span id="outputCharCount" class="font-bold text-green-600">0</span><span data-i18n="unit.char">字</span></span>
                        <button onclick="copyToClipboard()" class="flex items-center gap-1 text-sm bg-gray-800 text-white px-3 py-1.5 rounded-md hover:bg-gray-700 transition-colors shadow-sm" data-i18n-node="action.copy">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            複製
                        </button>
                    </div>
                </div>
                <textarea id="outputText" readonly class="w-full flex-1 min-h-[250px] p-4 bg-gray-900 text-green-400 border border-gray-700 rounded-xl focus:outline-none monospace-output overflow-auto shadow-inner" data-i18n-placeholder="output.placeholder" placeholder="結果將顯示於此……"></textarea>
            </div>

            <div id="messageBox" class="hidden fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded shadow-lg transition-opacity" data-i18n="msg.placeholder">
                訊息
            </div>
        </div>
    </div>

</body>
</html>
